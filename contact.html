<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Professional Resume</title>
    <meta name="description" content="Get in touch through social media or contact form">
    <link rel="stylesheet" href="public/styles.css">
</head>
<body>
    <nav id="nav-container">
        <!-- Navigation will be dynamically inserted here -->
    </nav>

    <noscript>
        <div class="noscript-warning">
            <p><strong>JavaScript is disabled.</strong> This website works best with JavaScript enabled, but you can still navigate using the links below:</p>
            <nav class="noscript-nav">
                <a href="index.html">About</a>
                <a href="experience.html">Experience</a>
                <a href="projects.html">Projects</a>
                <a href="skills.html">Skills</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </noscript>

    <main>
        <section class="contact-section">
            <h1 data-animation="fade-in">Contact</h1>
            
            <div id="contact-links-container" data-animation="slide-up">
                <!-- Contact links will be dynamically rendered here -->
            </div>

            <div class="contact-form-container" data-animation="slide-up">
                <h2>Send a Message</h2>
                <form id="contact-form">
                    <div class="form-group">
                        <label for="name">Name *</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="message">Message *</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    
                    <button type="submit" class="submit-button">Send Message</button>
                </form>
                
                <div id="form-message" class="form-message" style="display: none;"></div>
            </div>
        </section>
    </main>

    <script type="module" src="dist/contact.js"></script>
</body>
</html>
